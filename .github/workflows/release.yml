name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build Multi-Architecture Binaries
        env:
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          mkdir -p dist/packages
          
          # Target architectures
          TARGETS=("linux/amd64" "linux/arm64")
          
          for TARGET in "${TARGETS[@]}"; do
            OS="${TARGET%/*}"
            ARCH="${TARGET#*/}"
            OUT_DIR="dist/syncpaper-${TAG}-${OS}-${ARCH}"
            mkdir -p "${OUT_DIR}"
            
            echo "==> Building for ${OS}/${ARCH}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" go build -ldflags="-s -w -X main.version=${TAG#v}" -o "${OUT_DIR}/syncpaper" ./cmd/syncpaper
            cp README.md "${OUT_DIR}/"
            
            TARBALL="dist/packages/syncpaper-${TAG}-${OS}-${ARCH}.tar.gz"
            tar -czvf "${TARBALL}" -C dist "syncpaper-${TAG}-${OS}-${ARCH}"
          done
          
          # Compute SHA256 Checksums
          cd dist/packages
          sha256sum syncpaper-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Release ${{ steps.version.outputs.TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/packages/syncpaper-*.tar.gz
            dist/packages/SHA256SUMS
