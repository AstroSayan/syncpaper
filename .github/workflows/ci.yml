name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Tests & Measure Coverage
        run: |
          go test -v -coverprofile=coverage.out -coverpkg=./... ./tests/...
          go tool cover -func=coverage.out

      - name: Build Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o syncpaper ./cmd/syncpaper

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncpaper-linux-amd64
          path: syncpaper
          retention-days: 7
